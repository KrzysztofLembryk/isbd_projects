[package]
name = "II_proj_rest_server"
version = "0.1.0"
edition = "2024"

[dependencies]
actix-web = "4"
rand = "0.9.2"
serde = "1.0.228"
validator = {version = "0.20.0", features = ["derive"]}
csv = "1.4.0"
regex = "1.12.2"
zstd = "0.13.3"
serde_json = "1.0.145"
tokio = { version = "1.48", features = ["full"] }
log = "0.4.29"
env_logger = "0.11.8"

[dependencies.uuid]
version = "1.18.1"
# Lets you generate random UUIDs
features = [
    "v4",
    "serde"
]
